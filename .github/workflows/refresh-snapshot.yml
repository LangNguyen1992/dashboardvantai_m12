# =============================================================================
# Tu dong lam moi du lieu dashboard M12 (data-snapshot.json)
# Dat file nay tai: .github/workflows/refresh-snapshot.yml
# -----------------------------------------------------------------------------
# Chay moi 2 gio (gio Viet Nam: 06:00, 08:00, ... vi cron dung gio UTC),
# va co the bam chay tay bat cu luc nao o tab Actions.
# =============================================================================
name: Refresh data snapshot

on:
  schedule:
    # Moi 2 gio (UTC). VN = UTC+7.
    - cron: '0 */2 * * *'
  workflow_dispatch:        # cho phep bam chay tay tren giao dien GitHub

permissions:
  contents: write           # de workflow duoc phep commit file snapshot

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lay du lieu tu Google Sheet
        run: node refresh-snapshot-ci.js

      - name: Commit neu co thay doi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data-snapshot.json; then
            echo "Du lieu khong doi - bo qua commit."
          else
            git add data-snapshot.json
            git commit -m "chore: tu dong refresh data-snapshot ($(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y'))"
            git push
          fi
